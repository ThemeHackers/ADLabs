services:
  hybrid-wg-gateway:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: hybrid-wg-gateway
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Bangkok
      - SERVERURL=192.168.1.157
      - SERVERPORT=52059
      - PEERS=1
      - PEERDNS=10.110.10.10
      - INTERNAL_SUBNET=10.252.1.0/24
      - ALLOWEDIPS=10.110.10.0/24,10.110.20.0/24
    volumes:
      - ./wireguard_hybrid:/config
    ports:
      - 52059:51820/udp
    networks:
      ad-net: { ipv4_address: 10.110.10.150 }
      sync-net: { ipv4_address: 10.110.20.150 }
    restart: unless-stopped

  hybrid-core-router:
    image: debian:bookworm-slim
    container_name: hybrid-core-router
    privileged: true
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends iptables iproute2 net-tools procps &&
             sysctl -w net.ipv4.ip_forward=1 &&
             iptables -t nat -A POSTROUTING -j MASQUERADE &&
             sleep infinity"
    networks:
      ad-net: { ipv4_address: 10.110.10.254 }
      sync-net: { ipv4_address: 10.110.20.254 }
    restart: always

  hybrid-dc:
    image: linuxcrafts/samba-ad-dc:latest
    container_name: hybrid-dc
    privileged: true
    cap_add:
      - NET_ADMIN
    entrypoint: 
      - /bin/sh
      - -c
      - |
        ip route add 10.110.20.0/24 via 10.110.10.254 || true
        
        rm -rf /var/lib/samba
        ln -sf /samba /var/lib/samba
        
        mkdir -p /etc/samba
        rm -f /etc/samba/smb.conf
        ln -sf /samba/etc/smb.conf /etc/samba/smb.conf
        
        chmod 700 /samba/private/msg.sock || true
        rm -f /samba/private/tls/*.pem || true
        
        echo "Starting Samba AD DC for Hybrid Cloud Lab..."
        
        (
          sleep 15
          ln -sf /samba/etc/smb.conf /etc/samba/smb.conf
          samba-tool dbcheck --cross-ncs --fix --yes --configfile=/samba/etc/smb.conf
          samba-tool ntacl sysvolreset --configfile=/samba/etc/smb.conf
        ) &
        
        exec /samba-ad-dc
    environment:
      - DOMAIN=MEGACLOUD
      - REALM=MEGACORP-CLOUD.LOCAL
      - ADMIN_PASSWORD=CloudAdminMasterPass2026!
    volumes:
      - hybrid-dc-data:/samba
    networks:
      ad-net: { ipv4_address: 10.110.10.10 }
    dns: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "samba-tool domain info 127.0.0.1 --configfile=/samba/etc/smb.conf || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  hybrid-sync-srv:
    image: debian:bookworm-slim
    container_name: hybrid-sync-srv
    privileged: true
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends iproute2 procps python3 python3-pip sqlite3 openssh-server curl &&
             mkdir -p /var/run/sshd /opt/aadconnect &&
             ip route add 10.110.10.0/24 via 10.110.20.254 || true &&
             echo 'root:DevOpsRootPass2026!' | chpasswd &&
             sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config &&
             useradd -m -s /bin/bash devops_admin &&
             echo 'devops_admin:DevOpsPass2026!' | chpasswd &&
             /usr/sbin/sshd &&
             python3 -m http.server 80 --directory /opt/aadconnect/web &
             sleep infinity"
    networks:
      sync-net: { ipv4_address: 10.110.20.20 }
    restart: always

volumes:
  hybrid-dc-data:

networks:
  ad-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.110.10.0/24
  sync-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.110.20.0/24
