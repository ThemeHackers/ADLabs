services:
  sccm-wg-gateway:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: sccm-wg-gateway
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Bangkok
      - SERVERURL=192.168.1.157
      - SERVERPORT=52058
      - PEERS=1
      - PEERDNS=10.112.10.10
      - INTERNAL_SUBNET=10.252.1.0/24
      - ALLOWEDIPS=10.112.10.0/24,10.112.20.0/24
    volumes:
      - ./wireguard_sccm:/config
    ports:
      - 52058:51820/udp
    networks:
      mgmt-net: { ipv4_address: 10.112.20.150 }
    restart: unless-stopped

  sccm-core-router:
    image: debian:bookworm-slim
    container_name: sccm-core-router
    privileged: true
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends iptables iproute2 net-tools procps &&
             sysctl -w net.ipv4.ip_forward=1 &&
             iptables -t nat -A POSTROUTING -j MASQUERADE &&
             iptables -A FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT &&
             iptables -A FORWARD -p udp --dport 53 -j ACCEPT &&
             iptables -A FORWARD -p tcp --dport 53 -j ACCEPT &&
             iptables -A FORWARD -s 10.112.20.150 -d 10.112.10.0/24 -j DROP &&
             iptables -A FORWARD -s 10.252.12.0/24 -d 10.112.10.0/24 -j DROP &&
             sleep infinity"
    networks:
      ad-net: { ipv4_address: 10.112.10.254 }
      mgmt-net: { ipv4_address: 10.112.20.254 }
    restart: always

  sccm-dc:
    image: linuxcrafts/samba-ad-dc:latest
    container_name: sccm-dc
    privileged: true
    cap_add:
      - NET_ADMIN
    entrypoint: 
      - /bin/sh
      - -c
      - |
        ip route add 10.112.20.0/24 via 10.112.10.254 || true
        
        rm -rf /var/lib/samba
        ln -sf /samba /var/lib/samba
        
        mkdir -p /etc/samba
        rm -f /etc/samba/smb.conf
        ln -sf /samba/etc/smb.conf /etc/samba/smb.conf
        
        chmod 700 /samba/private/msg.sock || true
        rm -f /samba/private/tls/*.pem || true
        
        echo "Starting Samba AD DC for SCCM Pivot Lab..."
        
        (
          sleep 15
          ln -sf /samba/etc/smb.conf /etc/samba/smb.conf
          samba-tool dbcheck --cross-ncs --fix --yes --configfile=/samba/etc/smb.conf
          samba-tool ntacl sysvolreset --configfile=/samba/etc/smb.conf
        ) &
        
        exec /samba-ad-dc
    environment:
      - DOMAIN=CORPMGMT
      - REALM=CORP-MANAGEMENT.LOCAL
      - ADMIN_PASSWORD=ManagementAdminMasterPass2026!
    volumes:
      - sccm-dc-data:/samba
    networks:
      ad-net: { ipv4_address: 10.112.10.10 }
    dns: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "samba-tool domain info 127.0.0.1 --configfile=/samba/etc/smb.conf || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  sccm-site-srv:
    image: debian:bookworm-slim
    container_name: sccm-site-srv
    privileged: true
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends iproute2 procps python3 sqlite3 samba openssh-server curl &&
             mkdir -p /var/run/sshd /opt/sccm/shares/SMSPKGD /opt/sccm/web &&
             echo 'root:ManagementRootPass2026!' | chpasswd &&
             sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config &&
             echo 'AllowTcpForwarding yes' >> /etc/ssh/sshd_config &&
             echo 'GatewayPorts yes' >> /etc/ssh/sshd_config &&
             echo 'TCPKeepAlive yes' >> /etc/ssh/sshd_config &&
             useradd -m -s /bin/bash sccm_naa &&
             echo 'sccm_naa:NaaSecretPassword2026!' | chpasswd &&
             /usr/sbin/sshd &&
             python3 -m http.server 80 --directory /opt/sccm/web &
             sleep infinity"
    networks:
      mgmt-net: { ipv4_address: 10.112.20.20 }
      ad-net: { ipv4_address: 10.112.10.20 }
    dns:
      - 8.8.8.8
      - 10.112.10.10
    restart: always

volumes:
  sccm-dc-data:

networks:
  ad-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.112.10.0/24
  mgmt-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.112.20.0/24
