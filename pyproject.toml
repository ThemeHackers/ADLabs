[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adlabs"
version = "2.0.0"
description = "Automated Active Directory & OSCP Exam Simulation Lab Manager"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ADLabs Project Team"}
]
keywords = ["active-directory", "oscp", "security-lab", "penetration-testing", "docker", "wireguard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
    "flask>=2.2.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
pentest = [
    "impacket>=0.11.0",
    "pywinrm>=0.4.3",
]

[project.scripts]
adlabs = "adlabs:main"

[project.urls]
"Homepage" = "https://github.com/ThemeHackers/ADLabs"
